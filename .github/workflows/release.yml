name: release

# Tag a commit (git tag v1.0.0 && git push origin v1.0.0) to publish binaries,
# checksums and multi-arch images. install.sh downloads these assets; the hub's
# /install/cupola endpoint stays as the air-gapped fallback.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write
  packages: write

env:
  GHCR: ghcr.io/${{ github.repository_owner }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The tarball ships the built PWA too: a self-upgrade that replaced only
      # the binary would leave the UI at the old version.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        run: |
          cd web && npm ci && npm run build
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          out="cupola_${TAG#v}_${GOOS}_${GOARCH}"
          mkdir -p dist/stage
          go build -trimpath \
            -ldflags "-s -w -X github.com/abcdlsj/cupola/internal/version.Version=${TAG#v} -X github.com/abcdlsj/cupola/internal/version.Commit=${GITHUB_SHA} -X github.com/abcdlsj/cupola/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/stage/cupola" ./cmd/cupola
          cp -R web/dist dist/stage/web
          tar -C dist/stage -czf "dist/${out}.tar.gz" cupola web
          cp "dist/${out}.tar.gz" "dist/cupola_${GOOS}_${GOARCH}.tar.gz"
          rm -rf dist/stage
          echo "ASSET=dist/${out}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}/cupola:latest
            ${{ env.GHCR }}/cupola:${{ github.event.inputs.tag || github.ref_name }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
      - name: Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}/cupola-agent:latest
            ${{ env.GHCR }}/cupola-agent:${{ github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
